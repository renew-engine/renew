[package]
name = "renew-sample-cube"
description = "The cube sample's driver: runs the voxel world headless from a named script and answers with a digest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.renew]
purpose = "The voxel game's command-line face: parses a script name and a tick count, runs the world headless, and prints the digest as text and as JSON."
maturity = "bootstrap"
core = false
simulation = false

extension_points = []

[[bin]]
name = "cube"
path = "src/main.rs"

# Draw the world to a PNG. Off by default -- the game a player runs
# carries no graphics crate at all, which is what lets the build matrix
# prove this sample builds with the renderer removed.
[features]
render = ["dep:renew-rhi", "dep:renew-render3d", "dep:renew-png", "dep:renew-particles"]
# Play it: a window, a keyboard, and the camera on the player's head.
# Requires `render` structurally rather than by prose -- a window with
# nothing drawn in it is not a thing this game does.
window = [
    "render",
    "renew-platform/window",
    "renew-rhi/present",
    "dep:renew-event",
    "dep:renew-frame",
]

[dependencies]
renew-platform = { path = "../../crates/core/platform", default-features = false }
renew-camera = { path = "../../crates/camera" }
renew-math = { path = "../../crates/core/math" }
renew-fixed = { path = "../../crates/fixed" }
renew-sample-cube-world = { path = "world" }
renew-rhi = { path = "../../crates/rhi", default-features = false, optional = true }
renew-render3d = { path = "../../crates/render3d", optional = true }
renew-png = { path = "../../crates/png", optional = true }
renew-particles = { path = "../../crates/particles", features = ["render"], optional = true }
renew-event = { path = "../../crates/core/event", optional = true }
# The window plays against a wall clock, and a simulation stepped once
# per redraw would run at the panel's refresh rate rather than its own.
renew-frame = { path = "../../crates/frame", optional = true }

# The projection is index-and-vector arithmetic, which is the row in the
# testing table that asks for properties rather than examples. Same
# version the rendering crates pin.
[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
