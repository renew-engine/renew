// The packaging shell for the hello_triangle sample: one application
// module wrapping the cdylib the cargo build deposits in jniLibs.
// Hand-owned, never regenerated — every version here is a pin.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "hello_triangle"
include ":app"
