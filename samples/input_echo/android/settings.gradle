// The packaging shell for the input_echo sample: one application
// module wrapping the cdylib the cargo build deposits in jniLibs.
// Hand-owned, never regenerated — every version here is a pin.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "input_echo"
include ":app"
