[package]
name = "renew-bench"
description = "Benchmark suite: math, allocator, and job-pool kernels with allocation-count assertions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.renew]
purpose = "Criterion benchmarks over the math, allocator, and job-pool kernels, paired with exact allocation-count assertions."
maturity = "bootstrap"
core = false
extension_points = []
simulation = false

[features]
# Enabled by instrumented (sanitizer) test runs: allocation counting is
# invalid by construction when the runtime itself allocates.
sanitized = []

[dependencies]
renew-math = { path = "../../crates/core/math" }
renew-memory = { path = "../../crates/core/memory" }

[dev-dependencies]
# Bench-target-only, like the job pool above: the library itself
# schedules nothing.
renew-frame = { path = "../../crates/frame" }
renew-rng = { path = "../../crates/rng" }
criterion = "0.8"
# Bench-target-only: keeps the library's dependency graph free of the
# job pool it never uses.
renew-jobs = { path = "../../crates/jobs" }

[lints]
workspace = true

[[bench]]
name = "math"
harness = false

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "alloc_counted"
harness = false

[[bench]]
name = "jobs"
harness = false

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "rng"
harness = false
