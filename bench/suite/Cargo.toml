[package]
name = "renew-bench"
description = "Benchmark suite: criterion timings over engine kernels with allocation-count assertions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.renew]
purpose = "Criterion benchmarks over engine kernels — math, allocator, jobs, frame, rng, ecs, clock, particles, widget tree and its presenter — paired with exact allocation-count assertions."
maturity = "bootstrap"
core = false
extension_points = []
simulation = false

[features]
# Enabled by instrumented (sanitizer) test runs: allocation counting is
# invalid by construction when the runtime itself allocates.
sanitized = []

[dependencies]
renew-math = { path = "../../crates/core/math" }
renew-memory = { path = "../../crates/core/memory" }

[dev-dependencies]
# Bench-target-only, like the job pool above: the library itself
# schedules nothing.
renew-frame = { path = "../../crates/frame" }
renew-rng = { path = "../../crates/rng" }
# Bench-target-only: the clock is measured, not used, by this crate.
renew-platform = { path = "../../crates/core/platform" }
criterion = "0.8"
# Bench-target-only: keeps the library's dependency graph free of the
# job pool it never uses.
renew-jobs = { path = "../../crates/jobs" }
# The storage decision was settled on measurements that were never
# committed, so nothing here could detect a regression in what shipped.
renew-ecs = { path = "../../crates/ecs" }
# Bench-target-only: the pool's allocation behaviour is gated in its
# own crate; this suite only times it.
renew-particles = { path = "../../crates/particles" }
# Bench-target-only, and the same shape again: the tree and the
# presenter gate their allocations in their own crates; this suite
# times the solve, the re-solve, and the snapshot copy.
renew-ui = { path = "../../crates/ui" }
renew-ui-render = { path = "../../crates/ui-render" }
# Bench-target-only: the sprite construction chain the presenter runs
# per quad is device-free, so it is timed here even though the packer
# behind it is only reachable through a GPU device.
renew-render2d = { path = "../../crates/render2d" }
# Bench-target-only, and only for the atlas extent type the packer's
# device-free entry point takes; no feature, so no windowing or GPU
# crate enters this graph (the 2D renderer takes it the same way).
renew-rhi = { path = "../../crates/rhi", default-features = false }

[lints]
workspace = true

[[bench]]
name = "math"
harness = false

[[bench]]
name = "ecs"
harness = false

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "alloc_counted"
harness = false

[[bench]]
name = "jobs"
harness = false

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "rng"
harness = false

[[bench]]
name = "clock"
harness = false

[[bench]]
name = "particles"
harness = false

[[bench]]
name = "ui"
harness = false

[[bench]]
name = "sprite"
harness = false
