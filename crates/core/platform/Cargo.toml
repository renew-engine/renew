[package]
name = "renew-platform"
description = "Operating-system seams: monotonic time, whole-file I/O, named threads, the window, and audio output"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.renew]
purpose = "The engine's only doorway to the operating system: clock, filesystem, thread, window, and audio-output seams."
maturity = "internal"
core = true
extension_points = ["window-app"]
simulation = false

[features]
# Windowing and input via the platform's window module. Default-on;
# headless builds (servers, harnesses, CI cells) disable default
# features and compile the entire windowing stack out.
default = ["window"]
window = ["dep:winit", "dep:raw-window-handle"]
# Audio output via the platform's audio module. Default-OFF, unlike
# `window`: a headless harness has a display server more often than it
# has a sound card, and the callback-driven audio stack is worth
# compiling only where something actually plays. It carries the
# diagnostics crate with it, because the stream's error callback is the
# one place in this crate that reports from a thread it does not own.
audio-out = ["dep:cpal", "dep:renew-diag"]

[dependencies]
# The event vocabulary this crate re-exports as its `event` module.
# Unconditional, not behind the `window` feature: a headless build still
# needs to name a key, and the whole point of the extraction is that
# taking the vocabulary does not mean taking a clock.
renew-event = { path = "../event" }

# Explicit feature selection: both Linux backends and the window-handle
# interop. Wayland client-side decorations are deliberately OFF — the
# fallback decoration stack pulls an unmaintained font parser (caught by
# the advisory gate); compositors with server-side decorations decorate
# the window themselves, and an engine window works undecorated where
# they don't.
winit = { version = "=0.30.13", optional = true, default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }
# The windowing/GPU interop vocabulary: NativeWindow implements its two
# handle traits so the renderer can create a surface without either
# crate naming the other's internals.
raw-window-handle = { version = "=0.6.2", optional = true }
# Audio device and stream I/O. No default features: every optional
# backend it offers (JACK, ASIO, PulseAudio, PipeWire) is an extra
# dependency and an extra system package for a device this seam reaches
# through the platform's standard host anyway.
cpal = { version = "=0.18.1", optional = true, default-features = false }
# Carried by `audio-out` alone: the audio thread's error callback is the
# only reporter in this crate, so the default and headless graphs are
# exactly what they were without it.
renew-diag = { path = "../diag", optional = true }

[lints]
workspace = true

# The OS event loop must run on the main thread, which the default test
# harness cannot provide; this binary is its own harness and skips
# gracefully where no display server exists.
[[test]]
name = "window_smoke"
harness = false
required-features = ["window"]

# Provoking an OS thread refusal needs a process whose RUST_MIN_STACK is
# unsatisfiable, so this binary re-runs itself as a child; the default
# harness spawns a thread per test and would be refused before reaching
# the code under test.
[[test]]
name = "thread_spawn_refusal"
harness = false
