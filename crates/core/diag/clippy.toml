# Crate-local lint configuration: this crate's contract says it never
# reads a clock and never touches the filesystem — enforced here, not by
# convention. (A crate-local file fully replaces the workspace one, so the
# test allowances are repeated.)
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "this crate never reads a clock; sinks stamp records" },
    { path = "std::time::SystemTime::now", reason = "this crate never reads a clock; sinks stamp records" },
    { path = "std::fs::read", reason = "this crate never touches the filesystem; sinks own I/O" },
    { path = "std::fs::read_to_string", reason = "this crate never touches the filesystem; sinks own I/O" },
    { path = "std::fs::write", reason = "this crate never touches the filesystem; sinks own I/O" },
    { path = "std::fs::File::open", reason = "this crate never touches the filesystem; sinks own I/O" },
    { path = "std::fs::File::create", reason = "this crate never touches the filesystem; sinks own I/O" },
]

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
