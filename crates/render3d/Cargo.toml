[package]
name = "renew-render3d"
description = "Indexed 3D geometry over the rendering crate: mesh pipelines with and without a camera or a texture, depth-tested, indexed draws in submission order"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.renew]
purpose = "Indexed 3D geometry over the rendering crate: mesh pipelines with and without a camera or a texture, depth-tested, indexed draws in submission order."
maturity = "bootstrap"
core = false
extension_points = []
simulation = false

# The rendering crate without its presentation feature: this crate builds
# geometry and describes draws, it never presents, and taking the default
# would drag windowing crates into every consumer's graph.
[dependencies]
renew-rhi = { path = "../rhi", default-features = false }

# `Scene` is index-and-offset arithmetic over a byte container, which is
# the row in the testing table that asks for properties rather than
# examples. The same version the sibling crate pins.
[dev-dependencies]
proptest = "1.11"
# The counting allocator behind the steady-state gate.
renew-memory = { path = "../core/memory" }

# The switch the scheduled sanitizer workflow flips: allocation counting
# is invalid under instrumented allocators. Declared here ahead of the gate
# that needs it, so the workflow's crate list and this manifest agree.
[features]
sanitized = []

[lints]
workspace = true
