[package]
name = "renew-particles"
description = "Presentation-side particles: a fixed-capacity pool stepped at the simulation cadence, seeded so replays reproduce the same picture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.renew]
purpose = "Presentation-side particles: a seeded fixed-capacity pool stepped at the simulation cadence, and (behind the render feature) the billboard renderer that draws what it packs."
maturity = "bootstrap"
core = false
extension_points = []
simulation = false

# The pure half's only dependency is the seeded generator, so pools are
# testable on any machine; the GPU-facing half sits behind the `render`
# feature with its own dependency below.
[dependencies]
renew-rng = { path = "../rng" }
# The GPU half's dependency, behind its feature so the pure half stays
# device-free and the removability story stays one crate wide: a
# consumer that only steps pools never compiles a graphics API.
renew-rhi = { path = "../rhi", default-features = false, optional = true }

# Property tests for the pool's bounds and expiry — the containers row
# of the testing table (the lerp endpoint is a bit-exact unit test
# beside the packing) — and the engine's counting
# allocator for the zero-allocation gate, which ships with the crate's
# first per-frame code rather than after it.
[dev-dependencies]
proptest = "1.11"
renew-memory = { path = "../core/memory" }

# The switch the scheduled sanitizer workflow flips: allocation counting
# is invalid under instrumented allocators, so the gate ignores itself
# there. Declared only because the gate exists; the workspace test that
# pairs every declaration with the workflow line is what keeps this
# honest.
[features]
sanitized = []
# The renderer module: billboard pipeline, atlas, the draw item.
render = ["dep:renew-rhi"]

[lints]
workspace = true
