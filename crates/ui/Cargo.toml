[package]
name = "renew-ui"
description = "The retained widget tree and its fixed-point layout solver: arena-backed nodes solved into pixel rectangles, capacities fixed at construction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["ui", "layout", "gamedev", "retained-mode", "engine"]
categories = ["gui", "game-development"]
readme = "README.md"
homepage.workspace = true

[package.metadata.renew]
purpose = "The simulation-side widget tree, its Q47.16 flex-subset layout solver, its integer-only interaction surface, and the versioned document blob trees are read from: generationally addressed nodes solved into pixel rectangles behind a dirty flag, hit-tested for hover/press/focus decisions, and a fixed pool of text fields the focused node may hold — all of it folding into the engine state fingerprint."
maturity = "bootstrap"
core = false
extension_points = []
simulation = true

[lints]
workspace = true

[dependencies]
# The layout solver's arithmetic: Q47.16, saturating, bit-identical on
# every target — the crate simulation numbers are written in.
renew-fixed = { version = "0.1.1", path = "../fixed" }
# The digest the tree's decisions fold into — the same explicit-order
# fingerprint every simulation state answers with.
renew-frame = { version = "0.1.1", path = "../frame" }

# Property tests for the tree's invariants — the containers row of the
# testing table — and the engine's counting allocator for the
# zero-allocation gate, which ships with the crate's first per-frame
# code rather than after it.
[dev-dependencies]
proptest = "1.11"
renew-memory = { path = "../core/memory" }

# The switch the scheduled sanitizer workflow flips: allocation counting
# is invalid under instrumented allocators, so the gate ignores itself
# there.
[features]
sanitized = []
