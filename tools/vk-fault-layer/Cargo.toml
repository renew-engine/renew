[package]
name = "vk-fault-layer"
description = "Test-only Vulkan layer that passes calls through to the real driver and fails named calls on cue, so error paths are deterministically testable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ash = { version = "=0.38.0", default-features = false }

# A test tool, not an engine module: it must be able to carry `unsafe`
# (it is an FFI shim wall to wall), so it does not inherit the
# workspace lint table; the equivalent hygiene lints are set here.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[package.metadata.renew]
purpose = "Fault-injection Vulkan layer for testing driver-failure paths"
maturity = "bootstrap"
core = false
extension_points = []
simulation = false
