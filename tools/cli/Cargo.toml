[package]
name = "renew-cli"
description = "Command-line entry point for the workspace's canonical commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.renew]
purpose = "Command-line entry point wrapping the canonical build, test, bench, and lint commands plus an environment check."
maturity = "bootstrap"
core = false
extension_points = []
simulation = false

# The CLI's first dependency, and a workspace one: every engine
# capability gets a command-line face, and the pack format lives in the
# crate that defines it rather than being reimplemented here. A
# within-workspace edge carries no supply-chain or licence question; the
# hand-rolled JSON parser stays hand-rolled.
[dependencies]
renew-asset = { path = "../../crates/asset" }

# Test-only, and already approved for exactly this use: the entry covering
# it scopes it to dev-dependencies in test code, never linked into shipped
# code. The hand-rolled JSON reader is the third parser of external input
# in this workspace and the only one whose robustness rested on examples
# alone; the other two are covered by generated input.
[dev-dependencies]
proptest = "1.11"

[features]
# Enabled by instrumented (sanitizer) test runs. Five integration tests
# replace PATH with a single directory so the test decides what the
# binary can and cannot spawn; under ASan on Windows that also removes
# the sanitizer runtime DLL, and the child dies with
# STATUS_DLL_NOT_FOUND before it can choose the exit code they assert on.
sanitized = []

[lints]
workspace = true

[[bin]]
name = "renew"
path = "src/main.rs"
