[workspace]
resolver = "3"
# The fuzz harnesses are their own workspace: they link a runtime that
# needs nightly and sanitizer instrumentation, and pulling that into the
# stable build every merge depends on would break it.
exclude = ["fuzz"]
members = ["bench/suite", "crates/asset", "crates/audio", "crates/camera", "crates/core/diag", "crates/core/event", "crates/core/math", "crates/core/memory", "crates/core/platform", "crates/ecs", "crates/fixed", "crates/frame", "crates/physics2d",
    "crates/png", "crates/physics3d", "crates/input", "crates/jobs", "crates/particles", "crates/render2d", "crates/render3d", "crates/replay", "crates/rhi", "crates/rng", "crates/scene", "crates/snapshot", "crates/trace", "crates/ui", "crates/ui-render", "hello-engine", "samples/chess", "samples/chess/rules", "samples/cube", "samples/cube/world", "samples/glide", "samples/leap", "samples/leap/world", "samples/glide/world", "samples/hello_triangle", "samples/input_echo", "tools/cli", "tools/vk-fault-layer"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/renew-engine/renew"
homepage = "https://renew-engine.github.io/renew/"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Deny set: these never belong in committed non-test code.
# Test code is exempted from unwrap/expect/panic via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Every unsafe block states the invariant that makes it sound; the
# reviewer checks the argument, the lint checks the presence.
undocumented_unsafe_blocks = "deny"

[profile.release]
panic = "abort"
