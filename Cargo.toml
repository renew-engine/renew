[workspace]
resolver = "3"
members = ["bench/suite", "crates/core/diag", "crates/core/math", "crates/core/memory", "crates/core/platform", "crates/frame", "crates/jobs", "crates/rhi", "hello-engine", "samples/hello_triangle", "samples/input_echo", "tools/cli", "tools/vk-fault-layer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/renew-engine/renew"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Deny set: these never belong in committed non-test code.
# Test code is exempted from unwrap/expect/panic via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Every unsafe block states the invariant that makes it sound; the
# reviewer checks the argument, the lint checks the presence.
undocumented_unsafe_blocks = "deny"

[profile.release]
panic = "abort"
