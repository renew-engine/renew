name: Golden refresh

# Manual ritual only. Deletes the committed golden images and re-runs
# the golden tests on the pinned software Vulkan stack; the test's
# bootstrap path writes fresh candidates and FAILS BY DESIGN — a golden
# can never enter the tree through a passing run. The candidates land in
# an artifact for a human to inspect and commit alongside their
# provenance sidecars.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  refresh:
    name: Produce fresh golden candidates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/software-vulkan
      # Record what is being deleted so the verification below can be
      # derived from it. The delete is a wildcard and the check used to
      # be one hardcoded name, so a second golden would have been
      # removed and never checked for regeneration -- the ritual would
      # have passed while silently losing it.
      - name: Remove the committed goldens
        run: |
          # Full paths (extension stripped), nullglob so a crate whose
          # golden is still bootstrapping does not fail the listing.
          shopt -s nullglob
          for f in crates/rhi/tests/goldens/*.rgba crates/render2d/tests/goldens/*.rgba; do
            echo "${f%.rgba}"
          done > "$RUNNER_TEMP/goldens.txt"
          test -s "$RUNNER_TEMP/goldens.txt"
          echo "refreshing:"; cat "$RUNNER_TEMP/goldens.txt"
          rm -f crates/rhi/tests/goldens/*.rgba crates/render2d/tests/goldens/*.rgba
      # Expected to fail: the bootstrap path writes the candidate and
      # panics so the refresh is never silent.
      - name: Render fresh candidates (fails by design)
        id: render
        continue-on-error: true
        env:
          RENEW_GOLDEN: "1"
        run: cargo test --package renew-rhi --package renew-render2d --test golden
      - name: Verify the ritual behaved (test failed, every candidate exists)
        run: |
          test "${{ steps.render.outcome }}" = "failure"
          ls -l crates/rhi/tests/goldens/ crates/render2d/tests/goldens/
          missing=0
          while read -r name; do
            for suffix in candidate.rgba provenance.txt; do
              path="$name.$suffix"
              if [ ! -f "$path" ]; then
                echo "::error::$path was deleted but no replacement was produced"
                missing=1
              fi
            done
          done < "$RUNNER_TEMP/goldens.txt"
          test "$missing" -eq 0
      - name: Upload candidates for inspection
        uses: actions/upload-artifact@v4
        with:
          name: golden-candidates
          path: |
            crates/rhi/tests/goldens/
            crates/render2d/tests/goldens/
