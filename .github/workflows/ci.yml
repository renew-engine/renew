name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run lint checks
        run: cargo run --package renew-cli --bin renew -- lint

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo run --package renew-cli --bin renew -- test

  build:
    name: Build (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo run --package renew-cli --bin renew -- build

  build-release:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace (release)
        run: cargo build --workspace --profile release

  bench-build:
    name: Benchmark build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Each bench runs once (no statistics): proves every benchmark
      # compiles and executes. Timings are never gated here — hosted
      # runner variance would make that gate meaningless; regression
      # gating lives in the allocation-count assertions in the test
      # suite, and timing baselines are recorded out of band.
      - name: Run benchmark smoke (each bench once)
        run: cargo run --package renew-cli --bin renew -- bench --smoke

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace structure
        run: cargo run --package renew-cli --bin renew -- check

  removability:
    name: Removability (minus renew-jobs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The optional-crate configurations, derived from the manifest
      # graph: removing renew-jobs also removes its dependents (the
      # bench suite consumes it from bench targets). With one optional
      # crate this is a hand-derived matrix of one cell; it grows (or
      # gets generated) as optional crates appear.
      - name: Build without the optional crate
        run: cargo build --workspace --exclude renew-jobs --exclude renew-bench
      - name: Test without the optional crate
        run: cargo test --workspace --exclude renew-jobs --exclude renew-bench
      # The platform crate's headless configuration: the window feature
      # (and the whole windowing dependency tree) compiled out.
      - name: Build and test the platform crate headless
        run: |
          cargo build -p renew-platform --no-default-features
          cargo test -p renew-platform --no-default-features
      # The rendering crate removed entirely, and its presentation-free
      # configuration (offscreen only, no windowing interop).
      - name: Build and test without the rendering crate
        run: |
          cargo build --workspace --exclude renew-rhi
          cargo test --workspace --exclude renew-rhi
      - name: Build and test the rendering crate without presentation
        run: |
          cargo build -p renew-rhi --no-default-features
          cargo test -p renew-rhi --no-default-features

  rendering:
    name: Rendering (software Vulkan)
    # Pinned runner image: the golden images attest bytes from exactly
    # this stack, and a silent image bump must not be able to move them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/software-vulkan
      # RENEW_GOLDEN=1: on this lane a skipped GPU test is a failure —
      # the lane exists to run them, so an environment that cannot must
      # redden it rather than pass vacuously.
      - name: Run rendering tests on the pinned software rasterizer
        env:
          RENEW_GOLDEN: "1"
        run: cargo test --package renew-rhi --test golden --test device --test zero_alloc
      # The fault-injection layer makes driver-failure paths executable;
      # RENEW_FAULT_STRICT turns its absence into a failure here.
      - name: Build and stage the fault-injection layer
        run: |
          cargo build -p vk-fault-layer
          mkdir -p target/fault-layer
          printf '{\n  "file_format_version": "1.2.0",\n  "layer": {\n    "name": "VK_LAYER_RENEW_fault",\n    "type": "GLOBAL",\n    "library_path": "%s/target/debug/libvk_fault_layer.so",\n    "api_version": "1.3.281",\n    "implementation_version": "1",\n    "description": "renew fault-injection layer",\n    "functions": {\n      "vkNegotiateLoaderLayerInterfaceVersion": "vkNegotiateLoaderLayerInterfaceVersion"\n    }\n  }\n}\n' "$PWD" > target/fault-layer/VK_LAYER_RENEW_fault.json
      - name: Fault-injection scenarios on the pinned software rasterizer
        env:
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_RENEW_fault
          RENEW_FAULT_STRICT: "1"
        run: |
          export VK_ADD_LAYER_PATH="$PWD/target/fault-layer"
          cargo test --package renew-rhi --test fault
      # The golden bootstrap/refresh ritual writes its candidate and
      # fails; surface the candidate for human inspection.
      - name: Upload golden candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-candidates
          path: crates/rhi/tests/goldens/
          if-no-files-found: ignore
      - name: Install a virtual display and the distro software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers
      # The smoke presents through the distro lavapipe (the pinned
      # tarball is a deliberately headless build); the golden steps
      # above kept the pinned driver. The manifest is copied with its
      # library path pinned absolute so the loader can never resolve the
      # driver library out of another stack on LD_LIBRARY_PATH.
      - name: Present smoke and presentation fault scenarios under the virtual display
        env:
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_RENEW_fault
          RENEW_FAULT_STRICT: "1"
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$icd"
          driver=/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
          test -f "$driver"
          mkdir -p "$RUNNER_TEMP/distro-icd"
          sed "s|\"library_path\": \"[^\"]*libvulkan_lvp.so\"|\"library_path\": \"$driver\"|" \
            "$icd" > "$RUNNER_TEMP/distro-icd/lvp_icd.json"
          grep -q "$driver" "$RUNNER_TEMP/distro-icd/lvp_icd.json"
          export VK_DRIVER_FILES="$RUNNER_TEMP/distro-icd/lvp_icd.json"
          export VK_ADD_LAYER_PATH="$PWD/target/fault-layer"
          xvfb-run -a cargo test --package renew-rhi --test present_smoke
          xvfb-run -a cargo test --package renew-rhi --test fault_present

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # deny.toml is the policy: the license allowlist (with named
      # tooling exceptions) over the FULL graph including dev deps, the
      # RustSec advisory scan, and source pinning. The bans check is
      # advisory output only (duplicate versions in the log).
      - name: Check licenses and advisories
        run: cargo deny check licenses advisories sources bans

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The window smoke test needs a display; a virtual X server lets
      # it run (instead of skipping) so the windowing adapter's lines
      # count toward the gate honestly. libxkbcommon-x11 is the X11
      # keyboard runtime the windowing stack dlopens — absent on bare
      # runners, and its loader panics rather than erroring without it.
      # mesa-vulkan-drivers is the distro lavapipe: unlike the pinned
      # headless tarball, it carries window-system support, so the
      # presentation path executes here instead of skipping.
      - name: Install a virtual display and the distro software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers
      # The pinned action still supplies the validation layer (the
      # oracle); only the driver is overridden below, through a manifest
      # copy with its library path pinned absolute so the loader can
      # never resolve the driver library out of another stack on
      # LD_LIBRARY_PATH. No RENEW_GOLDEN here: this rasterizer's bits
      # are not the golden's provenance, so exact comparison correctly
      # stays off.
      - uses: ./.github/actions/software-vulkan
      # The fault layer runs under the whole collection so the
      # driver-failure ladders execute and count. Built with plain
      # cargo: the tool itself is not a coverage subject.
      - name: Build and stage the fault-injection layer
        run: |
          cargo build -p vk-fault-layer
          mkdir -p target/fault-layer
          printf '{\n  "file_format_version": "1.2.0",\n  "layer": {\n    "name": "VK_LAYER_RENEW_fault",\n    "type": "GLOBAL",\n    "library_path": "%s/target/debug/libvk_fault_layer.so",\n    "api_version": "1.3.281",\n    "implementation_version": "1",\n    "description": "renew fault-injection layer",\n    "functions": {\n      "vkNegotiateLoaderLayerInterfaceVersion": "vkNegotiateLoaderLayerInterfaceVersion"\n    }\n  }\n}\n' "$PWD" > target/fault-layer/VK_LAYER_RENEW_fault.json
      - name: Collect coverage
        env:
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_RENEW_fault
          RENEW_FAULT_STRICT: "1"
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$icd"
          driver=/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
          test -f "$driver"
          mkdir -p "$RUNNER_TEMP/distro-icd"
          sed "s|\"library_path\": \"[^\"]*libvulkan_lvp.so\"|\"library_path\": \"$driver\"|" \
            "$icd" > "$RUNNER_TEMP/distro-icd/lvp_icd.json"
          grep -q "$driver" "$RUNNER_TEMP/distro-icd/lvp_icd.json"
          export VK_DRIVER_FILES="$RUNNER_TEMP/distro-icd/lvp_icd.json"
          export VK_ADD_LAYER_PATH="$PWD/target/fault-layer"
          xvfb-run -a cargo llvm-cov --no-report test --workspace
          cargo llvm-cov --no-report run --bin hello-engine
          # The fault layer is test scaffolding that runs inside the
          # loader, not engine code, and cargo-llvm-cov already keeps
          # test sources out of the denominator — its tool crate
          # belongs on the same side of that line.
          cargo llvm-cov report --ignore-filename-regex 'tools/vk-fault-layer' --fail-under-lines 95
