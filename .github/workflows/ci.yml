name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run lint checks
        run: cargo run --package renew-cli --bin renew -- lint

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo run --package renew-cli --bin renew -- test

  build:
    name: Build (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo run --package renew-cli --bin renew -- build

  build-release:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace (release)
        run: cargo build --workspace --profile release

  bench-build:
    name: Benchmark build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Each bench runs once (no statistics): proves every benchmark
      # compiles and executes. Timings are never gated here — hosted
      # runner variance would make that gate meaningless; regression
      # gating lives in the allocation-count assertions in the test
      # suite, and timing baselines are recorded out of band.
      - name: Run benchmark smoke (each bench once)
        run: cargo run --package renew-cli --bin renew -- bench --smoke

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # FIRST, before any other cargo command. Every other invocation in
      # this file resolves dependencies and rewrites Cargo.lock in place
      # if it disagrees with the manifests -- so a --locked check placed
      # after one of them would pass on a lock the previous step had just
      # silently repaired, and would report success about nothing.
      #
      # Why this exists: a change added a dev-dependency without
      # committing the lockfile update. Thirteen checks went green and
      # `cargo --locked` failed outright on the merged result. No lane
      # asked, so nothing failed. This asks.
      #
      # `metadata` rather than `build`: it resolves the whole graph and
      # refuses, costs seconds, and needs nothing compiled.
      - name: Check the lockfile still describes the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Check workspace structure
        run: cargo run --package renew-cli --bin renew -- check

  removability:
    name: Removability (optional crates and headless configurations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `--exclude` deselects a crate; it does NOT stop a still-selected
      # member from pulling that crate in as a dependency. So the moment
      # an exclude list stops being upward-closed, its cell keeps
      # PASSING while compiling the very crate it claims to have
      # removed: a green gate measuring nothing, which is the worst
      # failure mode a gate has and one this tree has already paid for
      # once. Every removal cell below therefore asks the resolver,
      # before it builds anything, whether the crate is anywhere in the
      # graph its selection resolves to.
      #
      # Two details make the guard hard to fool. It first proves the
      # name IS in the full workspace graph, so a stale or misspelled
      # crate name fails loudly instead of "passing" on a name that
      # matches nothing. And it counts dev edges, because a
      # dev-dependency is exactly how the bench suite reaches
      # renew-jobs — the edge that already forces the jobs cell to
      # exclude renew-bench, invisible to `cargo build` and compiled by
      # `cargo test`.
      #
      # The exclude lists themselves are still written by hand.
      # Deriving them from reverse-dependency closures reported by
      # `renew check` is the durable fix and belongs with the structure
      # checker; until it exists, this guard is what keeps a
      # hand-written list from rotting in silence.
      - name: Stage the build-graph guard
        run: |
          cat > "$RUNNER_TEMP/absent-from-graph.sh" <<'GUARD'
          #!/usr/bin/env bash
          # usage: absent-from-graph.sh <crate> <cargo package-selection flags...>
          set -euo pipefail
          crate="$1"
          shift
          # Build-only cells narrow this to normal,build: they never
          # compile dev-dependencies, so counting those edges would
          # redden a configuration that is in fact clean.
          edges="${RENEW_GRAPH_EDGES:-normal,build,dev}"
          # --target all rather than the runner's triple: an exclude
          # list has to be upward-closed on every platform the engine
          # targets, and a cfg-gated edge would otherwise stay hidden
          # until someone ran this matrix somewhere other than Linux.
          # Plain assignments, not a pipe, so a cargo failure aborts
          # here instead of reading as "the crate is absent".
          full=$(cargo tree --edges "$edges" --target all --prefix none --format '{p}' --workspace)
          cell=$(cargo tree --edges "$edges" --target all --prefix none --format '{p}' "$@")
          if ! grep -q "^${crate} " <<<"$full"; then
            echo "::error::the guard was asked about '${crate}', which appears in no workspace graph at all — a stale or misspelled name proves nothing"
            exit 1
          fi
          if grep -q "^${crate} " <<<"$cell"; then
            echo "::error::'${crate}' is STILL in the build graph of [$*] — the exclude list is no longer upward-closed, so this cell would pass vacuously"
            exit 1
          fi
          echo "absent from the graph, as claimed: ${crate}  <-  $*"
          GUARD
      # Every cell holds its package selection in one unquoted variable
      # and feeds the same one to the guard and to both cargo runs:
      # that is what makes it impossible to change what a cell builds
      # without changing what the guard checked.
      #
      # renew-bench appears in two exclude lists because it reaches
      # both renew-jobs and renew-frame from its bench targets.
      - name: Build and test without the job system
        run: |
          sel="--workspace --exclude renew-jobs --exclude renew-bench"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-jobs $sel
          cargo build $sel
          cargo test $sel
      # The frame loop's dependents on day one: both samples, the
      # hello-engine example that now drives it instead of its own
      # accumulator, and the bench suite.
      - name: Build and test without the frame loop
        run: |
          sel="--workspace --exclude renew-frame --exclude renew-sample-hello-triangle --exclude renew-sample-input-echo --exclude renew-sample-glide --exclude renew-sample-glide-world --exclude hello-engine --exclude renew-bench"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-frame $sel
          cargo build $sel
          cargo test $sel
      # The generator removed entirely. Nothing in the engine depends on
      # it yet, so the exclude list is short today — but the bench suite
      # reaches it from a bench target, which is exactly the edge that
      # makes an exclude list stop being upward-closed if it is forgotten.
      - name: Build and test without the generator
        run: |
          sel="--workspace --exclude renew-rng --exclude renew-sample-glide-world --exclude renew-sample-glide --exclude renew-bench"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-rng $sel
          cargo build $sel
          cargo test $sel
      # The trace codec removed entirely, and with it the sample that
      # records traces. The comment here used to say the list was the
      # crate alone and would fail first the day a sample reached it.
      # That is precisely what happened, in the very next change: the
      # guard reported the crate still in the graph and named
      # input_echo as the reason. Kept as written evidence that the
      # guard catches this rather than passing vacuously.
      - name: Build and test without the trace codec
        run: |
          sel="--workspace --exclude renew-trace --exclude renew-replay --exclude renew-sample-input-echo --exclude renew-sample-glide"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-trace $sel
          cargo build $sel
          cargo test $sel
      # The rendering crate removed entirely. input_echo deliberately
      # survives this cell: a frame-loop sample that still builds and
      # runs with the GPU crate gone is the removability claim from the
      # other side.
      - name: Build and test without the rendering crate
        run: |
          sel="--workspace --exclude renew-rhi --exclude renew-render2d --exclude renew-sample-hello-triangle --exclude renew-sample-glide"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-rhi $sel
          cargo build $sel
          cargo test $sel
          # The game's oracle brought GPU crates into its DEV graph, so
          # the full test cell above must exclude it — but the property
          # this cell witnesses (the game itself needs no GPU) must not
          # lose its evidence. Build-only probe on normal edges: the
          # binary a player runs carries no rendering crate.
          RENEW_GRAPH_EDGES="normal,build" bash "$RUNNER_TEMP/absent-from-graph.sh" renew-rhi -p renew-sample-glide
          cargo build -p renew-sample-glide
      # The other half of the removability claim, and the half no cell
      # covered until now: the always-present crates on their own, with
      # every optional engine crate proven out of the graph rather than
      # merely left off the command line.
      # Three crates landed on 2026-07-31 and each needed its own cell.
      # The pack format's only dependent is the CLI, which calls it for
      # `asset-pack` and `asset-inspect` — an edge that makes this list
      # upward-closed only because it is named here.
      - name: Build and test without the asset pack
        run: |
          sel="--workspace --exclude renew-asset --exclude renew-cli"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-asset $sel
          cargo build $sel
          cargo test $sel
      # Storage has no dependents yet, so the exclude list is one crate.
      # It will grow the moment a system uses it, and the guard is what
      # turns forgetting that into a red cell rather than a green one.
      - name: Build and test without the entity storage
        run: |
          sel="--workspace --exclude renew-ecs --exclude renew-physics2d --exclude renew-sample-glide-world --exclude renew-sample-glide --exclude renew-bench"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-ecs $sel
          cargo build $sel
          cargo test $sel
      # The input layer, and the sample that consumes it. The exclude
      # list is upward-closed by necessity: removing a crate means
      # removing everything that calls it, or the configuration does not
      # build and proves nothing about removability.
      - name: Build and test without the input mapping
        run: |
          sel="--workspace --exclude renew-input --exclude renew-sample-input-echo --exclude renew-sample-glide"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-input $sel
          cargo build $sel
          cargo test $sel
      # The replay tooling, and the sample that consumes it.
      - name: Build and test without the replay tooling
        run: |
          sel="--workspace --exclude renew-replay --exclude renew-sample-input-echo --exclude renew-sample-glide"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-replay $sel
          cargo build $sel
          cargo test $sel
      # The 2D renderer: policy over the rendering crate, no consumers
      # yet -- the windowed game grows this list when it draws sprites.
      - name: Build and test without the 2D renderer
        run: |
          sel="--workspace --exclude renew-render2d --exclude renew-sample-glide"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-render2d $sel
          cargo build $sel
          cargo test $sel
          # Same witness as the without-rendering cell: the game's dev
          # graph gained the sprite renderer, its normal graph did not.
          RENEW_GRAPH_EDGES="normal,build" bash "$RUNNER_TEMP/absent-from-graph.sh" renew-render2d -p renew-sample-glide
          cargo build -p renew-sample-glide
      # The fixed-point arithmetic, and the collision crate written in it.
      # This cell was a single leaf when it landed, with a comment saying
      # the first crate to depend on it should discover the obligation
      # from a red lane rather than from nobody. It did: physics arrived
      # and this cell went red until it named the dependent.
      - name: Build and test without fixed-point arithmetic
        run: |
          sel="--workspace --exclude renew-fixed --exclude renew-physics2d"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-fixed $sel
          cargo build $sel
          cargo test $sel
      # Collision detection. No consumers yet -- the platformer that will
      # drive it is not written -- so the cell is the whole workspace
      # minus one leaf, and it grows the moment a sample collides.
      - name: Build and test without collision detection
        run: |
          sel="--workspace --exclude renew-physics2d"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-physics2d $sel
          cargo build $sel
          cargo test $sel
      # The audio stack. The game is excluded alongside it because the
      # game's DEV graph reaches the WAV reader unconditionally -- the
      # lane's own copy of the parse that `Audio::open` performs on its
      # way to a device, which exists precisely so a regenerated sound
      # is checked somewhere other than a machine with speakers. Its
      # normal graph does not, and the second guard below is what says
      # so rather than assuming it.
      - name: Build and test without audio
        run: |
          sel="--workspace --exclude renew-audio --exclude renew-sample-glide"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-audio $sel
          cargo build $sel
          cargo test $sel
          # The game without its `audio` feature is the default
          # configuration, and the mixer must be absent from it -- the
          # feature is the only edge, so a dependency that stopped being
          # optional would show up here and nowhere else. Dev edges are
          # excluded deliberately: the test copy of the parse is
          # supposed to be there.
          RENEW_GRAPH_EDGES="normal,build" bash "$RUNNER_TEMP/absent-from-graph.sh" renew-audio -p renew-sample-glide
          cargo build -p renew-sample-glide
      # The other direction: the game's window feature builds, lints,
      # and tests. No graph guard -- the build itself proves the WSI
      # stack is reachable, and the absence guards belong to the default
      # graph, where they already stand. Display-less-safe: no test
      # opens a window. Clippy rides here because the canonical lint
      # never compiles feature-gated code the default graph omits.
      - name: Build, lint, and test the game with its window feature
        run: |
          cargo build -p renew-sample-glide --features window
          cargo clippy -p renew-sample-glide --features window --all-targets -- -D warnings
          cargo test -p renew-sample-glide --features window
      - name: Build and test the minimal core alone
        run: |
          sel="-p renew-platform -p renew-diag -p renew-event -p renew-memory -p renew-math"
          for optional in renew-rhi renew-render2d renew-jobs renew-frame renew-rng renew-trace renew-asset renew-ecs renew-input renew-replay renew-audio renew-fixed renew-physics2d; do
            bash "$RUNNER_TEMP/absent-from-graph.sh" "$optional" $sel
          done
          cargo build $sel
          cargo test $sel
      # The platform crate's headless configuration: the window feature
      # (and the whole windowing dependency tree) compiled out.
      - name: Build and test the platform crate headless
        run: |
          sel="-p renew-platform --no-default-features"
          for wsi in winit raw-window-handle; do
            bash "$RUNNER_TEMP/absent-from-graph.sh" "$wsi" $sel
          done
          cargo build $sel
          cargo test $sel
      # The input layer names keys; it must not compile a windowing
      # library to do it. The vocabulary now lives in its own crate with
      # no dependencies, so the input layer reaches nothing else -- and
      # this cell guards that rather than assuming it. The crate has no
      # feature flags, so the plain build is the only build, and winit
      # must be absent from it.
      #
      # The platform crate is asserted absent too, and that is the
      # substantive half. This crate promises its output is a function of
      # build, seed and input alone; the lints backing that promise match
      # a definition path in the crate being compiled, so they stop at
      # the first wrapper. Reaching a clock through a first-party helper
      # named nothing they look for -- which is precisely what this crate
      # could do until the vocabulary moved out.
      #
      # Absence from the graph is the form of that promise nothing can
      # talk its way around. It is asserted separately rather than added
      # to the loop below: that loop enumerates window-system integration
      # libraries, and the platform crate is not one.
      #
      # Scope, stated so nobody reads more into a green cell than it
      # earns: this guards ONE crate. The general rule -- no crate
      # declaring simulation may reach the platform crate by any path --
      # is enforced by the workspace structure check for every crate
      # declaring the determinism marker; this per-crate probe predates
      # it and stays as a second witness on the one crate it names.
      - name: Build and test the input layer with no windowing library
        run: |
          sel="-p renew-input"
          bash "$RUNNER_TEMP/absent-from-graph.sh" renew-platform $sel
          for wsi in winit raw-window-handle; do
            bash "$RUNNER_TEMP/absent-from-graph.sh" "$wsi" $sel
          done
          cargo build $sel
          cargo test $sel
      # The rendering crate's presentation-free configuration
      # (offscreen only, no windowing interop). No graph guard: this
      # crate dev-depends on renew-platform with windowing on, so a
      # WSI-absence claim would be false at dev-edge granularity while
      # the library itself is clean.
      - name: Build and test the rendering crate without presentation
        run: |
          cargo build -p renew-rhi --no-default-features
          cargo test -p renew-rhi --no-default-features
      # The same sample and the same frame loop with no winit and no
      # window-system integration anywhere in the graph — the claim the
      # loop's independence from windowing rests on. Build only:
      # running it needs a Vulkan runtime this job does not have, so
      # the run lives on the rendering lane.
      - name: Build the sample with windowing compiled out
        env:
          RENEW_GRAPH_EDGES: normal,build
        run: |
          sel="-p renew-sample-hello-triangle --no-default-features"
          for wsi in winit ash-window raw-window-handle; do
            bash "$RUNNER_TEMP/absent-from-graph.sh" "$wsi" $sel
          done
          cargo build $sel

  # The feature-gated audio halves. They need a job rather than a cell
  # because the sound library compiles a different backend per platform
  # — ALSA here, WASAPI there — and a lane that built only one would let
  # the other rot until someone ran it by hand. The canonical lint never
  # sees feature-gated code, so clippy rides along, exactly as it does
  # for the window feature.
  #
  # Neither runner has a sound card, which is the point rather than a
  # gap: RENEW_AUDIO_ABSENT turns the deviceless answer into an
  # assertion that a device-open must report itself unavailable by name.
  # macOS is left out deliberately — its backend is the one the engine
  # cannot test on any runner it has, and claiming otherwise by adding a
  # leg that compiles but never opens anything would be the emptier
  # kind of green.
  audio:
    name: Audio (mixer, reader, and the device seam)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The sound library builds against ALSA on Linux; the runner
      # carries the library but not its headers. Windows needs nothing:
      # WASAPI ships with the SDK.
      - name: Install the Linux audio headers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build, lint, and test the audio halves
        run: |
          cargo build -p renew-audio
          cargo clippy -p renew-audio --all-targets -- -D warnings
          cargo test -p renew-audio
          cargo build -p renew-platform --features audio-out
          cargo clippy -p renew-platform --features audio-out --all-targets -- -D warnings
          cargo test -p renew-platform --features audio-out
          cargo build -p renew-sample-glide --features audio
          cargo clippy -p renew-sample-glide --features audio --all-targets -- -D warnings
          cargo test -p renew-sample-glide --features audio
        env:
          RENEW_AUDIO_ABSENT: "1"

  rendering:
    name: Rendering (software Vulkan)
    # Pinned runner image: the golden images attest bytes from exactly
    # this stack, and a silent image bump must not be able to move them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/software-vulkan
      # RENEW_GOLDEN=1: on this lane a skipped GPU test is a failure —
      # the lane exists to run them, so an environment that cannot must
      # redden it rather than pass vacuously.
      - name: Run rendering tests on the pinned software rasterizer
        env:
          RENEW_GOLDEN: "1"
        run: cargo test --package renew-rhi --test golden --test device --test zero_alloc
      # The sprite renderer's oracles on the same pinned rasterizer,
      # under the same rule: its computed-image test must run exactly
      # here too, and its committed golden is only compared on this
      # stack.
      - name: Sprite-renderer tests on the pinned software rasterizer
        env:
          RENEW_GOLDEN: "1"
        run: cargo test --package renew-render2d --test golden --test zero_alloc
      # The game's replay-capture oracle on the same pinned rasterizer:
      # committed traces replayed through the driver's own loop, drawn
      # through the sprite pipeline, compared against committed images.
      - name: Replay-capture oracle on the pinned software rasterizer
        env:
          RENEW_GOLDEN: "1"
        run: cargo test --package renew-sample-glide --test golden
      # The frame loop's rendering evidence, on the same pinned
      # rasterizer and under the same rule: the tick-derived pixel
      # oracle (does the readback match the colour the world computes
      # for the tick the loop says it is on) and the sample's
      # steady-state allocation gate. RENEW_FRAME_STRICT plays the part
      # RENEW_GOLDEN plays above — on this lane a skip is a failure,
      # because the coverage gate would otherwise be the only thing
      # noticing that these never ran.
      - name: Frame-loop sample tests on the pinned software rasterizer
        env:
          RENEW_GOLDEN: "1"
          RENEW_FRAME_STRICT: "1"
        # cli_determinism belongs here and was missing. It asserts
        # `!strict()` when a run reports SKIP, so it was written for this
        # lane specifically -- and this lane did not run it, which left
        # that assertion unreachable in the only configuration that sets
        # the variable. Naming suites by hand is why: the list and the
        # directory are maintained separately and drifted apart.
        run: |
          cargo test -p renew-sample-hello-triangle             --test headless_frame --test zero_alloc --test cli_determinism
      # The removability job proves this configuration BUILDS; only a
      # lane with a Vulkan runtime can prove it RUNS. Same binary, same
      # loop, same stats, with no winit anywhere in the graph — which
      # is a claim about the shipped artifact, not about the compiler.
      - name: Run the sample with windowing compiled out
        env:
          RENEW_FRAME_STRICT: "1"
        run: |
          cargo run -p renew-sample-hello-triangle --no-default-features \
            --bin hello_triangle -- --headless --frames 60
      # Cross-process determinism through the real CLI path: two whole
      # processes, no shared state but the code, and a byte-identical
      # digest line. A headless run reads no clock, so its output is a
      # pure function of (frames, step pattern, seed) — which is what
      # makes this comparable at all.
      - name: Headless determinism through the CLI path
        run: |
          mkdir -p target/frame-stats
          for run in 1 2; do
            cargo run --package renew-cli --bin renew -- \
              run hello_triangle --headless --frames 600 \
              --dump-stats "target/frame-stats/run$run.json" \
              > "target/frame-stats/run$run.log"
            cat "target/frame-stats/run$run.log"
            # The digest line is the whole contract: one stable string
            # a human can read in a log and `diff` can compare, with no
            # JSON parser in the sample's dev-dependencies. Extracted
            # rather than diffing whole logs, because cargo's own
            # progress output is not part of the claim — and grep
            # failing here is the right outcome if the line vanishes,
            # rather than two empty files agreeing with each other.
            grep -m1 '^renew-frame ' "target/frame-stats/run$run.log" \
              > "target/frame-stats/run$run.digest"
          done
          diff target/frame-stats/run1.digest target/frame-stats/run2.digest
      # Timing is recorded here, never gated: hosted wall time decides
      # nothing, but the numbers are worth having when a frame-budget
      # negotiation starts. Uploaded even on failure — a red run is
      # when they are most interesting.
      - name: Upload frame stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-stats
          path: target/frame-stats/
          if-no-files-found: ignore
      # The fault-injection layer makes driver-failure paths executable;
      # RENEW_FAULT_STRICT turns its absence into a failure here.
      - name: Build and stage the fault-injection layer
        run: |
          cargo build -p vk-fault-layer
          mkdir -p target/fault-layer
          printf '{\n  "file_format_version": "1.2.0",\n  "layer": {\n    "name": "VK_LAYER_RENEW_fault",\n    "type": "GLOBAL",\n    "library_path": "%s/target/debug/libvk_fault_layer.so",\n    "api_version": "1.3.281",\n    "implementation_version": "1",\n    "description": "renew fault-injection layer",\n    "functions": {\n      "vkNegotiateLoaderLayerInterfaceVersion": "vkNegotiateLoaderLayerInterfaceVersion"\n    }\n  }\n}\n' "$PWD" > target/fault-layer/VK_LAYER_RENEW_fault.json
      - name: Fault-injection scenarios on the pinned software rasterizer
        env:
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_RENEW_fault
          RENEW_FAULT_STRICT: "1"
        run: |
          # Appended, never replaced: the pinned action put the SDK's
          # layer directory here, and that is where the validation
          # layer lives. Overwriting it silently disables validation,
          # which turns every "zero validation errors" assertion in
          # this step into a claim about nothing.
          export VK_ADD_LAYER_PATH="$PWD/target/fault-layer:$VK_ADD_LAYER_PATH"
          cargo test --package renew-rhi --package renew-render2d --test fault
      # The golden bootstrap/refresh ritual writes its candidate and
      # fails; surface the candidate for human inspection.
      - name: Upload golden candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-candidates
          path: |
            crates/rhi/tests/goldens/
            crates/render2d/tests/goldens/
            samples/glide/tests/goldens/
          if-no-files-found: ignore
      - name: Install a virtual display and the distro software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers
      # The smoke presents through the distro lavapipe (the pinned
      # tarball is a deliberately headless build); the golden steps
      # above kept the pinned driver. The manifest is copied with its
      # library path pinned absolute so the loader can never resolve the
      # driver library out of another stack on LD_LIBRARY_PATH.
      - name: Present smoke and presentation fault scenarios under the virtual display
        env:
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_RENEW_fault
          RENEW_FAULT_STRICT: "1"
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$icd"
          driver=/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
          test -f "$driver"
          mkdir -p "$RUNNER_TEMP/distro-icd"
          sed "s|\"library_path\": \"[^\"]*libvulkan_lvp.so\"|\"library_path\": \"$driver\"|" \
            "$icd" > "$RUNNER_TEMP/distro-icd/lvp_icd.json"
          grep -q "$driver" "$RUNNER_TEMP/distro-icd/lvp_icd.json"
          export VK_DRIVER_FILES="$RUNNER_TEMP/distro-icd/lvp_icd.json"
          # Appended, never replaced: the pinned action put the SDK's
          # layer directory here, and that is where the validation
          # layer lives. Overwriting it silently disables validation,
          # which turns every "zero validation errors" assertion in
          # this step into a claim about nothing.
          export VK_ADD_LAYER_PATH="$PWD/target/fault-layer:$VK_ADD_LAYER_PATH"
          # RENEW_GOLDEN=1: this lane installed the layer, so a run that
          # skips for want of it has lost the thing the lane exists to
          # provide. Making the skip fatal is what keeps that visible --
          # libtest prints captured output only for failing tests, so a
          # skip that passes prints nothing at all.
          RENEW_GOLDEN=1 xvfb-run -a cargo test --package renew-rhi --test present_smoke
          xvfb-run -a cargo test --package renew-rhi --test fault_present
          # The allocation contract on the window path. Named here as well
          # as declared in the manifest: a suite absent from this list runs
          # nowhere and passes vacuously, which has happened once already.
          RENEW_GOLDEN=1 xvfb-run -a cargo test --package renew-rhi --test present_zero_alloc

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # deny.toml is the policy: the license allowlist (with named
      # tooling exceptions) over the FULL graph including dev deps, the
      # RustSec advisory scan, and source pinning. The bans check is
      # advisory output only (duplicate versions in the log).
      - name: Check licenses and advisories
        run: cargo deny check licenses advisories sources bans

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The window smoke test needs a display; a virtual X server lets
      # it run (instead of skipping) so the windowing adapter's lines
      # count toward the gate honestly. libxkbcommon-x11 is the X11
      # keyboard runtime the windowing stack dlopens — absent on bare
      # runners, and its loader panics rather than erroring without it.
      # mesa-vulkan-drivers is the distro lavapipe: unlike the pinned
      # headless tarball, it carries window-system support, so the
      # presentation path executes here instead of skipping.
      - name: Install a virtual display and the distro software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers
      # The pinned action still supplies the validation layer (the
      # oracle); only the driver is overridden below, through a manifest
      # copy with its library path pinned absolute so the loader can
      # never resolve the driver library out of another stack on
      # LD_LIBRARY_PATH. No RENEW_GOLDEN here: this rasterizer's bits
      # are not the golden's provenance, so exact comparison correctly
      # stays off.
      - uses: ./.github/actions/software-vulkan
      # The fault layer runs under the whole collection so the
      # driver-failure ladders execute and count. Built with plain
      # cargo: the tool itself is not a coverage subject.
      - name: Build and stage the fault-injection layer
        run: |
          cargo build -p vk-fault-layer
          mkdir -p target/fault-layer
          printf '{\n  "file_format_version": "1.2.0",\n  "layer": {\n    "name": "VK_LAYER_RENEW_fault",\n    "type": "GLOBAL",\n    "library_path": "%s/target/debug/libvk_fault_layer.so",\n    "api_version": "1.3.281",\n    "implementation_version": "1",\n    "description": "renew fault-injection layer",\n    "functions": {\n      "vkNegotiateLoaderLayerInterfaceVersion": "vkNegotiateLoaderLayerInterfaceVersion"\n    }\n  }\n}\n' "$PWD" > target/fault-layer/VK_LAYER_RENEW_fault.json
      - name: Collect coverage
        env:
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_RENEW_fault
          RENEW_FAULT_STRICT: "1"
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$icd"
          driver=/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
          test -f "$driver"
          mkdir -p "$RUNNER_TEMP/distro-icd"
          sed "s|\"library_path\": \"[^\"]*libvulkan_lvp.so\"|\"library_path\": \"$driver\"|" \
            "$icd" > "$RUNNER_TEMP/distro-icd/lvp_icd.json"
          grep -q "$driver" "$RUNNER_TEMP/distro-icd/lvp_icd.json"
          export VK_DRIVER_FILES="$RUNNER_TEMP/distro-icd/lvp_icd.json"
          # Appended, never replaced: the pinned action put the SDK's
          # layer directory here, and that is where the validation
          # layer lives. Overwriting it silently disables validation,
          # which turns every "zero validation errors" assertion in
          # this step into a claim about nothing.
          export VK_ADD_LAYER_PATH="$PWD/target/fault-layer:$VK_ADD_LAYER_PATH"
          xvfb-run -a cargo llvm-cov --no-report test --workspace
          cargo llvm-cov --no-report run --bin hello-engine
          # A binary target that is COMPILED but never RUN reports 0%
          # and is charged in full against the 100% gate, so every
          # sample binary has to execute here or the commit that adds
          # one reddens Coverage for a reason that is not a coverage
          # regression. Both arms of each sample run: the headless
          # driver (synthetic time, no clock, no window) and, under the
          # virtual display, the WindowApp arms that only a real event
          # loop reaches.
          mkdir -p "$RUNNER_TEMP/frame-stats"
          cargo llvm-cov --no-report run -p renew-sample-hello-triangle --bin hello_triangle -- \
            --headless --frames 8 --dump-stats "$RUNNER_TEMP/frame-stats/hello_triangle.json"
          xvfb-run -a cargo llvm-cov --no-report run -p renew-sample-hello-triangle --bin hello_triangle -- \
            --frames 30
          # The scripted trace IS the input: no runner supplies
          # keystrokes, so without --input-trace the whole event-
          # handling half of this sample is uncoverable.
          cargo llvm-cov --no-report run -p renew-sample-input-echo --bin input_echo -- \
            --headless --input-trace walk
          xvfb-run -a cargo llvm-cov --no-report run -p renew-sample-input-echo --bin input_echo -- \
            --frames 30
          # The game's two committed traces: one that plays, one that
          # falls. Both are pure headless runs, so they execute anywhere.
          cargo llvm-cov --no-report run -p renew-sample-glide --bin glide -- \
            --input-trace soar --frames 600
          cargo llvm-cov --no-report run -p renew-sample-glide --bin glide -- \
            --input-trace sink --frames 600
          # The game's windowed feature, in two instrumented pieces: the
          # feature-gated unit tests (display-less-safe -- they open no
          # window), and the windowed arm live under the virtual display.
          # Keyboardless there: the bird falls; a legal run.
          cargo llvm-cov --no-report test -p renew-sample-glide --features window
          xvfb-run -a cargo llvm-cov --no-report run -p renew-sample-glide --features window --bin glide --             --window --frames 30
          # The fault layer is test scaffolding that runs inside the
          # loader, not engine code, and cargo-llvm-cov already keeps
          # test sources out of the denominator — its tool crate
          # belongs on the same side of that line. The same filter goes
          # to both reports below, so the table in the log and the gate
          # that follows are measuring the same tree.
          #
          # The export comes first so the gate always has something to
          # read, even when the percentage backstop below trips.
          cargo llvm-cov report --ignore-filename-regex 'tools[\/]vk-fault-layer' \
            --json --output-path target/coverage.json
          # The percentage is a backstop, not the gate: it puts the
          # per-file table in the log, where the first person reading a
          # failure needs it, and it catches a collection that collapsed
          # wholesale rather than regressed line by line.
          cargo llvm-cov report --ignore-filename-regex 'tools[\/]vk-fault-layer' --fail-under-lines 95
      # The gate: 100% of every line the tree does not name in
      # coverage-exemptions.toml, and it ratchets both ways — an
      # unexempted uncovered line fails, and so does an exemption whose
      # line is covered again, because a stale exemption is a hole left
      # open on exactly the line someone once proved could not be
      # closed. Reading the export rather than shelling out keeps the
      # rule itself unit-tested and the failure message specific.
      - name: Check coverage against the exemption manifest
        run: cargo run --package renew-cli --bin renew -- coverage --report target/coverage.json

  # Determinism is only a property of a program if it survives the machine
  # the program runs on. Every other determinism check in this repository
  # compares a run to itself, or to a constant this repository minted —
  # both of which prove an unseeded generator absent and neither of which
  # can prove the target did not matter, because both halves ran on one
  # target.
  #
  # These two jobs are the only place that claim is actually tested. Each
  # leg runs the pinned simulations on its own target and reports what it
  # saw; the comparison holds the reports against each other. A leg that
  # cannot run reports nothing, and reporting nothing is a failure rather
  # than an absent objection.
  determinism-emit:
    name: Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never fail-fast: one target diverging is exactly the finding this
      # pair exists to produce, and cancelling the others would throw
      # away the evidence of which ones agreed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Emit this target's digests
        run: cargo run --package renew-cli --bin renew -- determinism --emit leg.json
      - name: Show what this target reported
        shell: bash
        run: cat leg.json
      # One artifact per leg: upload-artifact@v4 requires distinct names,
      # and the runner label is what distinguishes them.
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: leg.json
          if-no-files-found: error

  determinism-compare:
    name: Determinism (cross-platform comparison)
    runs-on: ubuntu-latest
    needs: [determinism-emit]
    # `needs` on a failed job SKIPS this one, and GitHub reports a skipped
    # required job as neutral rather than failed — which is how a
    # comparison that never ran can read as a comparison that passed.
    # `always()` runs it regardless, and the first step below turns the
    # upstream result back into a failure explicitly.
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Refuse to compare when a leg did not finish
        if: needs.determinism-emit.result != 'success'
        run: |
          echo "the emit legs concluded '${{ needs.determinism-emit.result }}', so at least"
          echo "one target reported nothing. A missing target is an untested target, not a"
          echo "passing one, and this job fails rather than comparing what remains."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          path: legs
      - name: Show what arrived
        run: find legs -type f -print -exec cat {} +
      # The comparison itself is a workspace subcommand, not shell in this
      # file: it is unit-tested, a developer can reproduce a red lane
      # locally with the same command, and its refusals — a missing leg, an
      # empty digest set, an architecture set that does not match the
      # target list, two legs on different compilers — live where tests can
      # reach them. A gate whose logic exists only in CI configuration is a
      # gate no test can hold to account.
      - name: Compare every target against every other
        run: |
          cargo run --package renew-cli --bin renew -- determinism \
            --compare legs/determinism-ubuntu-latest/leg.json \
            --compare legs/determinism-windows-latest/leg.json \
            --compare legs/determinism-macos-latest/leg.json
