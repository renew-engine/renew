# Fuzzing: scheduled, and never a merge gate.
#
# The harnesses need the nightly toolchain for sanitizer instrumentation,
# so a break here can be nightly moving rather than the engine regressing.
# Gating merges on that would make an upstream change able to stop work,
# which is why this runs on a schedule and reports instead.
#
# Short runs on a schedule are a smoke test, not a campaign: they catch a
# harness that stopped building and shallow input bugs. The committed
# corpus is the memory that outlives a job -- every run starts from it,
# and the stable workspace replays it as a merge gate.
name: Fuzz

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [asset_pack, trace_parse, wav, ui_document, ui_text, net_datagram]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # The tool named explicitly: the @tool-name tag shorthand resolved
      # with an empty tool once already -- the action's own warning names
      # the failure mode -- and an install that silently installs nothing
      # fails two steps later with a misleading message.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The licence policy is checked here rather than at the root: these
      # harnesses are a separate workspace, so the root check never
      # resolves their dependencies and cannot see the term this allows.
      - uses: taiki-e/install-action@cargo-deny
      - name: Check the harness licences
        working-directory: fuzz
        run: cargo deny --config ../deny.toml check licenses
      - name: Run ${{ matrix.target }} from the committed corpus
        working-directory: fuzz
        # The directory is corpus-in and findings-out: the run starts
        # from everything already recorded instead of rediscovering the
        # magic numbers, and new coverage lands beside it.
        # +nightly explicitly: the repository pins stable via
        # rust-toolchain.toml, and that directory override outranks the
        # job's installed default -- the inner build inherits nightly
        # through the toolchain environment only when the outer call
        # names it.
        # --target named too: the prebuilt installer ships a musl-linked
        # binary, and the fuzzer defaults its build target to its OWN
        # compile-time triple -- musl, where the sanitizer cannot link.
        # This runner is gnu; say so.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=120 -print_final_stats=1
      # Growth is the interesting output of a healthy run. It leaves the
      # runner as an artifact a human inspects, minimizes, and commits --
      # re-commits are manual and event-driven, never a bot's.
      - name: Upload the corpus with any growth
        # always(): a crashing run's growth is the most interesting of
        # all -- the default success condition would drop exactly it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
      # A crash is the whole point of the job, so the input that caused it
      # has to leave the runner. Without this the log says a crash happened
      # and the bytes that caused it are deleted with the workspace.
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
