name: Nightly checks

on:
  schedule:
    # Daily, not weekly. It was weekly, and that is why two failures sat
    # on main unseen: the job last ran nine hours before the crate that
    # breaks it landed, so every green run in its history was green
    # about code that no longer existed.
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }}, ${{ matrix.os }})
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sanitizer: address
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sanitizer: thread
            # The only lane with a Vulkan runtime. Without one, every
            # device-touching test takes the graceful-skip path and passes
            # while doing nothing, and a skip prints only on failure — so
            # a green log is exactly the case that withholds the fact.
            vulkan: true
          - os: macos-latest
            target: aarch64-apple-darwin
            sanitizer: address
          - os: macos-latest
            target: aarch64-apple-darwin
            sanitizer: thread
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sanitizer: address
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ./.github/actions/software-vulkan
        if: matrix.vulkan
      - name: Run tests under ${{ matrix.sanitizer }} sanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=${{ matrix.sanitizer }}"
          # On the lane that has a driver, a skipped device test is a
          # failure: the lane exists to run them, so passing must mean
          # executed rather than absent. Empty elsewhere, where a skip is
          # the only honest outcome.
          RENEW_GOLDEN: ${{ matrix.vulkan && '1' || '' }}
          # Run the rasterizer single-threaded. This is a DIAGNOSTIC, and
          # the variable under test.
          #
          # A previous attempt added the runtime alone and found three
          # races: two entirely inside lavapipe's fence lifecycle, and one
          # with engine frames -- DeviceShared::drop closing the loader
          # while a driver worker thread was still live. Reading the
          # teardown afterwards showed the engine's order is the
          # spec-required one and nothing instance-derived outlives the
          # instance, which argues against an engine defect and leaves
          # "lavapipe does not join its workers by vkDestroyDevice" as the
          # live hypothesis. A reading is not a sanitizer report.
          #
          # LP_NUM_THREADS=0 turns llvmpipe's threading off entirely
          # (Mesa's documented behaviour for zero). Against the recorded
          # three-race baseline this is a single-variable experiment and
          # every outcome is informative:
          #   - all three gone: the other side of each was a driver worker,
          #     so the engine teardown is exonerated and the remaining
          #     question is lavapipe's, not ours;
          #   - the two driver-internal ones gone, the engine-frame one
          #     left: the other side is NOT a driver worker, which is a
          #     worse and more interesting finding;
          #   - all three still there: the variable does not reach lavapipe
          #     and the hypothesis needs a different lever.
          #
          # It is set on every lane because it names nothing that exists
          # where no rasterizer does.
          LP_NUM_THREADS: "0"
          # Read only by the thread sanitizer; harmless where the file's
          # contents mean nothing. Every line in it is a place this job
          # has been told not to look, so it is short and each entry
          # carries its own reasoning.
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt"
        # Doctests are compiled without sanitizer instrumentation and fail the
        # ABI-mismatch check; they run in the regular CI workflow instead.
        # The sanitized feature marks allocation-counting tests ignored:
        # instrumented runtimes allocate on their own, so those counts are
        # meaningless here (the regular CI workflow measures them).
        #
        # THIS LIST MUST NAME EVERY CRATE THAT DECLARES THE FEATURE. It is
        # hand-maintained against manifests it cannot see, and it has now
        # gone stale twice: once for renew-frame, whose counting test ran
        # under instrumented allocators and passed while measuring noise,
        # and once for the hello_triangle sample. Neither was caught by a
        # gate. To check it by hand:
        #   grep -rl '^sanitized = ' --include=Cargo.toml .
        run: cargo +nightly test --workspace --lib --bins --tests --features renew-diag/sanitized,renew-memory/sanitized,renew-bench/sanitized,renew-jobs/sanitized,renew-rhi/sanitized,renew-rng/sanitized,renew-frame/sanitized,renew-sample-hello-triangle/sanitized,renew-cli/sanitized -Zbuild-std --target ${{ matrix.target }}
      # The jobs crate's long stress tier is #[ignore]d in ordinary runs;
      # under the sanitizers it runs in full — the interleaving depth is
      # the point of this job.
      - name: Run the jobs long stress tier
        env:
          RUSTFLAGS: "-Zsanitizer=${{ matrix.sanitizer }}"
        run: cargo +nightly test -p renew-jobs --test stress --features renew-jobs/sanitized -Zbuild-std --target ${{ matrix.target }} -- --ignored

  miri:
    name: Miri (unsafe-bearing crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run library unsafe under Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: "8"
        # Scope: every crate carrying library `unsafe`; extend the list as
        # such crates appear. Counting-allocator integration tests are
        # excluded (global-allocator installation trips a known std/Miri
        # interaction, and the counters are exercised by the lib tests'
        # callers indirectly in regular CI). The jobs suites shrink their
        # thread/iteration constants under cfg(miri).
        run: |
          cargo +nightly miri test -p renew-memory --lib --test properties
          cargo +nightly miri test -p renew-jobs --lib --test properties --test panic_paths --test stress
          cargo +nightly miri test -p renew-rhi --lib
