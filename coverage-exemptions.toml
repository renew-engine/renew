# Coverage exemptions: the named lines the coverage gate accepts as
# uncovered. Everything the gate measures and this file does not list must
# be covered — the threshold for the rest of the tree is 100%.
#
# The ratchet runs in BOTH directions, and both directions fail CI:
#
#   * an uncovered line with no entry here is a new gap. Cover it, or add
#     an entry whose reason survives review.
#   * a line listed here that the report says is covered is a STALE
#     exemption, and that is a failure too. A stale exemption is not
#     harmless: it is a hole punched in the gate, blinding it to every
#     future regression on that exact line. Exemptions are deleted when
#     they stop being true, never left to rot.
#
# Exempting a whole file is never acceptable, for the same reason: it
# would blind the gate to every future regression anywhere in that file.
# Exemptions are per line, and they are named.
#
# Enforced by `renew coverage --report <llvm-cov export>`, which CI runs in
# the Coverage job. Format — one `[[exempt]]` table per group of lines that
# share one reason:
#
#   file    repository-relative, forward slashes, on every platform
#   lines   the exempt line numbers, as one array on one line
#   reason  why the line cannot be covered. Plain text on one line: the
#           reader accepts no escapes, so a stray quote or backslash is a
#           loud error rather than a silent truncation.
#
# Line numbers move when the text above them moves. Editing an exempt file
# means re-checking its entry here — and if it is forgotten, the gate says
# so, in whichever direction the mistake went.
#
# Drift reads as staleness, so the report distinguishes them for you. An
# entry left behind by moved code now points at whatever occupies the old
# number, which is usually covered — so the gate calls it covered and, on
# its own, that reads as "delete this". It is not: the exemption is still
# earned, at a new number. Whenever a covered-now finding shares its file
# with lines that are uncovered and unexempted, the finding names them,
# because that is where the code most likely went. Re-point the entry
# instead of deleting it, and check the reason still describes what is
# there.
#
# A `reason` must never cite a line number, and must name the code it
# describes — "the keyboard arm", not "line 390". The gate reads `lines`
# and never reads this prose, so a number written here has no guard at all
# and goes stale silently the first time the file grows. That happened
# once: a note said "line 390" long after the arm it meant had moved to
# 483, and by then 390 was error handling in an unrelated function. The
# `lines` array had been kept correct the whole time, which is exactly why
# nobody noticed the sentence beside it was not.

[[exempt]]
file = "crates/core/memory/src/arena.rs"
lines = [75, 95]
reason = "Calls handle_alloc_error, which aborts through ud2; that bypasses atexit, so the profiling runtime never writes its counters. The line executes, but no counter can survive to record it."

[[exempt]]
file = "crates/core/memory/src/pool.rs"
lines = [93]
reason = "A release-mode refusal guarded by a debug assertion on the same condition, so it is unreachable in any build that measures coverage. It is the last defence against slot aliasing in a build with assertions off."

[[exempt]]
file = "crates/jobs/src/lib.rs"
lines = [455, 517]
reason = "A release-mode refusal guarded by a debug assertion on the same condition, so it is unreachable in any build that measures coverage. It is the last defence against dispatching on a poisoned pool, or over a live batch, in a build with assertions off."

[[exempt]]
file = "crates/asset/src/write.rs"
lines = [94, 95, 100, 101, 105, 106, 129, 130, 133, 134]
reason = "The width guards on the pack's own header fields. Reaching one needs more than four billion entries, or more than four gibibytes of names or of payload in a single pack; the per-entry pair is narrower still, since a name is already bounded to 1024 bytes and a blob length is a usize widening to u64. They are checked conversions rather than casts because a silently wrapped length is a reader pointed at arbitrary bytes, and because the count field is the kind that gets widened later. Unreachable on a 64-bit target and retained for the 32-bit one the platform list does not exclude."

[[exempt]]
file = "crates/rhi/src/vk/offscreen.rs"
lines = [680]
reason = "The unreachable arm of the walk's surface-depth barrier: a depth-carrying surface pass on a depthless target was already refused by the DepthUnsupported check before recording began, so the walk cannot hand this site a depth use with no depth image. The arm exists so the guaranteed-Some is stated without a banned expect; driving it would require breaking the refusal it stands behind."

[[exempt]]
file = "crates/rhi/src/vk/pass.rs"
lines = [862]
reason = "The unreachable arm behind the sample-before-write refusal: the assert immediately above proved the entry exists, and the let-else restates it without a banned expect. No frame can drive it."

[[exempt]]
file = "crates/render3d/src/gpu.rs"
lines = [627, 628]
reason = "The depthless-adapter arm of the shadow map's refusal, which translates the rendering crate's DepthUnsupported into this crate's own variant rather than reporting it as a texture failure. Unreachable wherever a depth format exists, which is every measuring lane's adapter: the format is chosen at device bring-up from a void query no fault layer can mutate, and the layer's quirk list carries no depthless-adapter quirk either. The sibling arm (any other creation failure) is driven by the R10 fault scenario."

[[exempt]]
file = "crates/rhi/src/vk/render_image.rs"
lines = [228, 229, 230, 231]
reason = "The format-feature pre-check's refusal: every measuring lane's adapter reports SAMPLED_IMAGE and the attachment feature for both kinds' formats, and vkGetPhysicalDeviceFormatProperties is a void query no fault layer can mutate - the same unreachability the depthless-adapter exemptions record. The refusal exists for adapters the lanes do not have."

[[exempt]]
file = "crates/rhi/src/vk/offscreen.rs"
lines = [383]
reason = "The depthless-adapter arm of target creation: no depth image is built when the adapter refused the whole depth format chain. The pinned software rasterizer offers D32_SFLOAT, the format query is a void call no fault layer can mutate, and the device suite's probe asserts a format exists wherever the strict lane runs — so the arm is reachable only on hardware the lanes do not have. Its logic is one None."

[[exempt]]
file = "crates/rhi/src/vk/offscreen.rs"
lines = [509, 510, 511]
reason = "The DepthUnsupported refusal for a depth-carrying frame on a depthless adapter. Same unreachability as the creation arm above: every measuring lane's adapter offers a depth format, and the query that decides it cannot be faulted. The error construction is driven by the display test in the error module; the branch condition's false side runs on every depth-carrying frame."

[[exempt]]
file = "crates/rhi/src/vk/pipeline.rs"
lines = [1102, 1103, 1104]
reason = "The DepthUnsupported refusal for a depth-state pipeline on a depthless adapter - the pipeline-creation twin of the target-side refusal, unreachable for the same reason: the lanes' adapters offer a depth format and the void format query cannot be faulted."

[[exempt]]
file = "crates/rhi/src/vk/swapchain.rs"
lines = [519, 520, 521]
reason = "The DepthUnsupported refusal for a depth-carrying frame on a depthless adapter, window side - same unreachability as the offscreen twin: the lanes' adapters offer a depth format and the void format query cannot be faulted."

[[exempt]]
file = "crates/rhi/src/vk/swapchain.rs"
lines = [1359]
reason = "The depthless-adapter side of chain population, where no per-slot depth images are built. Unreachable wherever a depth format exists, which is every measuring lane's adapter."

[[exempt]]
file = "crates/audio/src/mixer.rs"
lines = [197, 198]
reason = "The arm that clears a voice whose sound index is missing. A voice is only ever created from an identifier the mixer already resolved against its own table, and the table only grows, so no input reaches this. It is retained because the alternative is indexing directly, which puts a panic on the audio callback - the one thread in the engine where a panic is an abort in a real-time deadline rather than a diagnosable failure. Unreachable on purpose, kept on purpose."

[[exempt]]
file = "tools/cli/src/main.rs"
lines = [86, 87, 88, 1201, 1202, 1203, 1204, 1210, 1211, 1213, 1214, 1215, 1220, 1221, 1222, 1223, 1224, 1225, 1226, 1228, 1229, 1230, 1231, 1232, 1233, 1234, 1235, 1236, 1240, 1241, 1242, 1243, 1244, 1245, 1246, 1247, 1248, 1249, 1250, 1251, 1253, 1257, 1258]
reason = "The emit half of determinism: it spawns a cargo run per pinned scenario and reads what they printed, so reaching it from a test would mean building and running whole samples under instrumentation. It is not untested — the three determinism legs execute every line of it on Linux, Windows and macOS on every push, and a failure there is what a broken emit looks like. Everything in it that can be tested without a subprocess was moved into digests_from_output, which has five cases beside it. What is left is process orchestration and the paths taken when a child cannot start or exits non-zero."

[[exempt]]
file = "tools/cli/src/main.rs"
lines = [1264]
reason = "The comparison refusing to start because no workspace root is above it. Every other subcommand carries the same arm and reaches it the same way -- never, from a test, because a test runs inside the workspace it is testing. Reaching it would mean invoking the binary from outside any cargo project, which is a property of where a caller stands rather than of anything this code does."

[[exempt]]
file = "samples/cube/src/windowed.rs"
lines = [639, 640, 641, 642, 643, 644, 718]
reason = "The two places a window resize is acted on: rebuilding the crosshair for the new shape, and telling the swapchain its new size. Both need a real window-system resize, and the lane that measures coverage has none - its windowed runs happen under a virtual display with no window manager, so the window it opens is the only size it will ever be. Note for anyone running coverage on a desktop: these lines ARE covered there, because a real window manager sends a resize on the way up, and the gate will call this exemption stale. The gate that decides is the headless one. Everything these lines follow from is covered everywhere: record_present drives the recovery from a dormant swapchain with a constructed outcome, the resize event handler is driven with a constructed event, and the crosshair geometry is checked at four aspects without a device."

[[exempt]]
file = "crates/core/platform/src/window.rs"
lines = [476, 477]
reason = "The scale-factor and keyboard arms of the winit event translation. Neither payload type has a public constructor in the pinned windowing crate, so the input cannot be built outside it, and neither event can be provoked from inside the process. Each arm is a single delegation to a helper that IS driven directly, so the translation logic itself is covered. Note for local runs: on a machine with a live desktop a stray keyboard event can reach the window smoke test's real window and cover the keyboard arm, which then reports as a stale exemption. Under the virtual display CI uses there is no keyboard, so it is stable there; if this flaps locally, that is why."

[[exempt]]
file = "crates/core/platform/src/window.rs"
lines = [804]
reason = "A test double's required method that cannot be called: its argument borrows a live OS window, which needs a main-thread event loop the test harness cannot host."

[[exempt]]
file = "crates/core/platform/src/window.rs"
lines = [404, 405, 406, 407, 408, 409, 410, 411, 412, 413]
reason = "Delivering raw device motion. No lane has a mouse - the windowed runs happen under a virtual display, which reports no device movement - so this callback is never entered there. What it decides IS covered: translate_device_event is driven with constructed winit events, and the sample's accumulator and whole-degree boundary are driven with constructed deltas. This is the arm, not the argument. Deliberately narrow: the cursor grab and its reapplication on focus are NOT exempted, because a window under a virtual display does receive focus events and the gate is the authority on whether those arms run."

[[exempt]]
file = "crates/ui/src/bin/ui_digest.rs"
lines = [33, 34, 41, 42]
reason = "The scenario binary's two refusal arms: the argument guard (a drifted pinned-run row must fail loudly rather than run a different scenario under the same name) and the impossible-construction arm (reachable only if a four-insert scenario overflows a sixteen-node limit; a vacuous zero digest must never reach the comparison). Each is two lines - a message and a nonzero exit - and an exiting process does not reliably flush its coverage counters, so exercising them under the instrumented lane would hinge on an exit-path implementation detail rather than prove anything. The happy path is executed by the lane's own run of the binary."

[[exempt]]
file = "samples/glide/src/windowed.rs"
lines = [407, 408, 409, 410, 411, 412, 413]
reason = "The menu-open half of the draw: the presenter's snapshots advanced and emitted, and a label placed per button. The lane's windowed run is keyboardless under a virtual display, so nothing there ever opens the menu, and no test reaches draw at all - drawing needs the bring-up's live target. Everything the block decides is covered without it: the advance/emit pair by the presentation crate's own tests, the placement arithmetic by a unit test on label_origin (the block's only computation), and the routing, pausing, restarting and rescaling behind it by constructed-event tests on the seam. Deliberately narrow: the is_open check the frame evaluates every draw is measured and not exempt."
